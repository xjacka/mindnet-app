    <!-- PWA: díky manifestu se dá web nainstalovat a pak se objeví v systémovém
         sdílení Chromu na Androidu (share_target v manifest.json).
         Cesty jsou relativní schválně: web běží i pod podcestou
         (GitHub Pages, /mindnet-app/app/), kde by /manifest.json
         a /sw.js mířily mimo appku. -->
    <link rel="manifest" href="manifest.json" />
    <meta name="theme-color" content="#14171c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      /* Posuvníky jen při posouvání, tenké jako na telefonu: na Macu s myší
         nebo s volbou „posuvníky vždy" jinak stojí trvale vedle feedu.
         Kontejner, který se právě posouvá, dostane ze skriptu dole
         atribut data-scrolling a ten posuvník na chvíli zviditelní. */
      * {
        scrollbar-width: thin;
        scrollbar-color: transparent transparent;
      }
      [data-scrolling] {
        scrollbar-color: rgba(128, 128, 128, 0.55) transparent;
      }
      /* Safari standardní vlastnosti posuvníku nezná. */
      @supports not (scrollbar-color: red red) {
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: transparent; border-radius: 4px; }
        [data-scrolling]::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.55); }
      }
    </style>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.

    <!-- The root element for your Expo app. -->
    <div id="root"></div>
    <script>
      // Chrome na Androidu nabídne web ve sdílení jen u nainstalované PWA a ta
      // potřebuje service worker. Tenhle jen propouští požadavky dál — nic
      // necachuje, takže vývoj nezmrzne na staré verzi.
      // Posuvník viditelný jen během posouvání (styl výš). Scroll nebublá,
      // proto se poslouchá ve fázi capture — chytí každý posuvný kontejner.
      (function () {
        var timers = new WeakMap();
        document.addEventListener('scroll', function (e) {
          var el = e.target === document ? document.documentElement : e.target;
          if (!el || !el.setAttribute) return;
          if (!el.hasAttribute('data-scrolling')) el.setAttribute('data-scrolling', '');
          clearTimeout(timers.get(el));
          timers.set(el, setTimeout(function () { el.removeAttribute('data-scrolling'); }, 900));
        }, { capture: true, passive: true });
      })();

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('sw.js').catch(function () {});
        });
      }
    </script>
